name: Safe CI Token Capability Diagnostics

on:
  pull_request:
  workflow_dispatch:

jobs:
  read-probes:
    runs-on: ubuntu-latest
    steps:
      - name: Compare authenticated vs anonymous GET access
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['CI_JOB_TOKEN']
          prefix = f'https://api.github.com/repos/{repo}'
          endpoints = {
              'metadata': '',
              'contents': '/contents',
              'branches': '/branches',
              'tags': '/git/matching-refs/tags',
              'issues': '/issues',
              'pull requests': '/pulls',
              'issue comments': '/issues/comments',
              'actions workflows': '/actions/workflows',
              'actions runs': '/actions/runs',
              'actions artifacts': '/actions/artifacts',
              'releases': '/releases',
              'deployments': '/deployments',
              'environments': '/environments',
              'collaborators': '/collaborators',
              'branch rules': '/rules/branches',
          }

          def status(url, bearer=None):
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'safe-ci-token-probe',
              }
              if bearer:
                  headers['Authorization'] = 'Bearer ' + bearer
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return str(resp.status)
              except urllib.error.HTTPError as err:
                  return str(err.code)
              except Exception as err:
                  return type(err).__name__

          print('Repository:', repo)
          print('Event:', os.environ['GITHUB_EVENT_NAME'])
          print(f"{'Resource':22} {'Authenticated':>14} {'Anonymous':>12}")
          for name, endpoint in endpoints.items():
              url = prefix + endpoint
              print(f'{name:22} {status(url, token):>14} {status(url):>12}')
          print('GET success establishes read accessibility only, not write permission.')
          print('See Set up job > GITHUB_TOKEN Permissions for assigned scopes.')
          PYCODE

  # Explicitly limited to a manually started run in the account owner's fork.
  # No workflow in an upstream PR can enter this job.
  fork-only-write-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Probe tag write and issue-comment write in my own fork only
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          actor = os.environ['GITHUB_ACTOR']
          event = os.environ['GITHUB_EVENT_NAME']
          # Fail closed: only the manually invoked workflow in actor's own repository.
          assert event == 'workflow_dispatch'
          assert repo.split('/')[0].lower() == actor.lower()
          token = os.environ['CI_JOB_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'safe-ci-write-probe',
          }

          def req(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(base+path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = response.read()
                      return response.status, json.loads(payload) if payload else {}
              except urllib.error.HTTPError as err:
                  return err.code, {}

          # Create then delete a disposable lightweight tag. No releases or package builds.
          status, repo_info = req('GET', '')
          if status != 200:
              raise SystemExit('Cannot read repository metadata')
          default = repo_info['default_branch']
          status, ref = req('GET', '/git/ref/heads/' + default)
          if status != 200:
              raise SystemExit('Cannot resolve default branch')
          tag = 'ci-permission-test-' + str(int(time.time()))
          status, _ = req('POST', '/git/refs', {'ref': 'refs/tags/' + tag, 'sha': ref['object']['sha']})
          print('Create temporary tag:', status)
          if status == 201:
              delete_status, _ = req('DELETE', '/git/refs/tags/' + tag)
              print('Delete temporary tag:', delete_status)

          PYCODE
